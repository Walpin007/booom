<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Random Bomb</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:manipulation}.game{height:100dvh;position:relative;display:flex;justify-content:center;align-items:center;background:#fff;overflow:hidden}.startWrap{position:absolute;inset:0;display:grid;place-items:center;transition:.18s}.start{width:150px;height:150px;border:0;border-radius:50%;background:#d71912;box-shadow:0 13px 0 #8f0e0a,0 18px 0 #bbb;position:relative;color:#fff;font-size:25px;font-weight:900;letter-spacing:1px;text-shadow:0 2px #8f0e0a;cursor:pointer;transform:translateY(-8px)}.start:active,.start.pressed{transform:translateY(4px);box-shadow:0 3px 0 #8f0e0a,0 7px 0 #bbb}.hidden{opacity:0;pointer-events:none}.timer{position:absolute;top:17%;font-family:'Courier New',monospace;font-weight:900;font-size:clamp(38px,12vw,68px);letter-spacing:-3px;color:#e11111;text-shadow:0 0 7px rgba(225,17,17,.18);opacity:0;z-index:4}.timer.on{opacity:1}.stage{position:absolute;left:50%;top:59%;width:210px;height:210px;transform:translate(-50%,-50%);z-index:2}.bomb{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%) scale(var(--zoom,1));opacity:0;filter:drop-shadow(0 10px 0 rgba(0,0,0,.12));transform-origin:center bottom}.bomb.drop{animation:drop .62s cubic-bezier(.25,.85,.32,1.15) forwards}.bomb.pop{animation:pop .18s ease-out}.body{position:absolute;left:20px;top:34px;width:96px;height:96px;background:#20252b;border:7px solid #0c0e11;border-radius:46% 48% 50% 50%;box-shadow:inset 12px 9px 0 #343b43}.cap{position:absolute;left:55px;top:21px;width:33px;height:22px;background:#3c4248;border:6px solid #111;border-bottom:0}.fuse{position:absolute;left:79px;top:0;width:47px;height:38px;border-top:7px solid #3d2b20;border-radius:50%;transform:rotate(-18deg)}.fire{position:absolute;right:0;top:-10px;width:22px;height:27px;background:#ff3b00;clip-path:polygon(50% 0,70% 35%,100% 48%,76% 72%,62% 100%,42% 77%,10% 91%,20% 55%,0 37%,35% 31%);filter:drop-shadow(0 0 2px #ffb000)}.floor{position:absolute;left:50%;top:77%;width:150px;height:24px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.06);opacity:0}.blast{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:6}.blast.go{animation:blast .55s steps(5,end) forwards}.blast:before,.blast:after{content:"";position:absolute;inset:-45px;background:#ffb000;clip-path:polygon(50% 0,61% 31%,86% 14%,75% 41%,100% 50%,72% 61%,88% 86%,60% 72%,50% 100%,39% 71%,13% 87%,29% 60%,0 50%,30% 40%,14% 13%,40% 30%)}.blast:after{inset:-25px;background:#e52a0b;transform:rotate(18deg)}.scorch{position:absolute;left:50%;top:67%;width:130px;height:38px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#191919 0 25%,#555 45%,rgba(70,70,70,0) 72%);opacity:0}.scorch.on{opacity:1}.smoke{position:absolute;left:50%;top:57%;width:18px;height:18px;border-radius:3px;background:#777;opacity:0}.smoke.on{animation:smoke 2.3s ease-out infinite}.result{position:absolute;top:30%;font-weight:900;font-size:24px;opacity:0;z-index:8}.result.on{opacity:1}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}.flash.go{animation:flash .26s linear}.dud .fire{animation:dud .5s forwards}.dudText{color:#222;font-size:28px}.restart{position:absolute;bottom:8%;border:2px solid #222;background:#fff;padding:12px 18px;font-weight:800;opacity:0;pointer-events:none}.restart.on{opacity:1;pointer-events:auto}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-390%) scale(.9)}68%{opacity:1;transform:translate(-50%,-45%) scale(1.04)}82%{transform:translate(-50%,-65%) scale(.98)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes pop{0%,100%{transform:translate(-50%,-50%) scale(var(--zoom))}45%{transform:translate(-50%,-50%) scale(calc(var(--zoom) * 1.11))}}@keyframes blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}60%{opacity:1;transform:translate(-50%,-50%) scale(3.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}@keyframes smoke{0%{opacity:.65;transform:translate(-50%,20px) scale(.8)}100%{opacity:0;transform:translate(calc(-50% + 18px),-115px) scale(2.4)}}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}@keyframes dud{to{opacity:0;transform:scale(.4)}}
</style></head><body><main class="game" id="game"><div class="startWrap" id="startWrap"><button class="start" id="start">START</button></div><div class="timer" id="timer">00:00:00</div><div class="result" id="result"></div><div class="stage"><div class="floor" id="floor"></div><div class="bomb" id="bomb"><div class="body"></div><div class="cap"></div><div class="fuse"><div class="fire"></div></div></div><div class="blast" id="blast"></div></div><div class="scorch" id="scorch"></div><div class="smoke" id="smoke"></div><div class="flash" id="flash"></div><button class="restart" id="restart">RESTART</button></main>
<script>
(()=>{const MAX=90000,SLOT=10,SURVIVE=.01;const p=1-Math.pow(SURVIVE,1/(MAX/SLOT));const start=document.querySelector('#start'),wrap=document.querySelector('#startWrap'),timer=document.querySelector('#timer'),bomb=document.querySelector('#bomb'),floor=document.querySelector('#floor'),blast=document.querySelector('#blast'),scorch=document.querySelector('#scorch'),smoke=document.querySelector('#smoke'),flash=document.querySelector('#flash'),result=document.querySelector('#result'),restart=document.querySelector('#restart');let t0=0,lastSlot=0,ended=false,raf=0,lastSecond=-1,nextFake=0;
const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296};
const fmt=ms=>{ms=Math.min(ms,MAX);const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`};
function vibrate(x){try{navigator.vibrate?.(x)}catch(e){}}
function fakeFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');vibrate(25)}
function tick(now){if(ended)return;const e=now-t0;timer.textContent=fmt(e);const sec=Math.floor(e/1000);if(sec!==lastSecond){lastSecond=sec;if(sec>0){vibrate(45);bomb.classList.remove('pop');void bomb.offsetWidth;bomb.classList.add('pop')}}const zoom=1+Math.min(e/MAX,.98)*.55;bomb.style.setProperty('--zoom',zoom.toFixed(3));
 const slot=Math.min(Math.floor(e/SLOT),MAX/SLOT);for(let i=lastSlot+1;i<=slot;i++){if(rnd()<p){explode(i*SLOT);return}}lastSlot=slot;if(e>=nextFake&&e<MAX-1500){fakeFlash();nextFake=e+7000+rnd()*13000}if(e>=MAX){dud();return}raf=requestAnimationFrame(tick)}
function explode(ms){ended=true;cancelAnimationFrame(raf);timer.textContent=fmt(ms);vibrate([80,40,180]);bomb.style.opacity='0';blast.classList.add('go');setTimeout(()=>{scorch.classList.add('on');smoke.classList.add('on');restart.classList.add('on')},330)}
function dud(){ended=true;timer.textContent='01:30:00';bomb.classList.add('dud');vibrate([40,80,40]);result.textContent='DUD!';result.className='result on dudText';setTimeout(()=>restart.classList.add('on'),500)}
function begin(){start.classList.add('pressed');vibrate(20);setTimeout(()=>{wrap.classList.add('hidden');timer.classList.add('on');floor.style.opacity='1';bomb.classList.add('drop');t0=performance.now();lastSlot=0;lastSecond=-1;ended=false;nextFake=8000+rnd()*10000;raf=requestAnimationFrame(tick)},120)}
start.addEventListener('click',begin);restart.addEventListener('click',()=>location.reload());
console.log('Per 10ms explosion probability:',p,'90s survival:',Math.pow(1-p,9000));})();
</script></body></html>
