<script>
(()=>{const MAX=90000,SLOT=10,SURVIVE=.01,p=1-Math.pow(SURVIVE,1/(MAX/SLOT));const $=s=>document.querySelector(s),start=$('#start'),wrap=$('#startWrap'),timer=$('#timer'),bomb=$('#bomb'),ground=$('#ground'),explosion=$('#explosion'),scorch=$('#scorch'),smoke=$('#smoke'),flash=$('#flash'),result=$('#result'),restart=$('#restart');let t0=0,lastSlot=0,ended=false,raf=0,lastSecond=-1,nextFake=0,starting=false;
const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296};const fmt=ms=>{ms=Math.min(ms,MAX);const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`};
const segMap={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};const digs=[];function digit(){const d=document.createElement('span');d.className='digit';for(const k of 'abcdefg'){const i=document.createElement('i');i.className='seg '+k;d.appendChild(i)}return d}for(let i=0;i<8;i++){if(i===2||i===5){const c=document.createElement('span');c.className='colon';timer.appendChild(c)}else{const d=digit();timer.appendChild(d);digs.push(d)}}function setTimer(t){timer.setAttribute('aria-label',t);const n=t.replaceAll(':','');digs.forEach((d,i)=>{const on=segMap[n[i]]||'';for(const s of d.children)s.classList.toggle('on',on.includes(s.classList[1]))})}setTimer('00:00:00');const vib=x=>{try{navigator.vibrate?.(x)}catch{}};
function fakeFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');vib(25)}function tick(now){if(ended)return;const e=now-t0;setTimer(fmt(e));const sec=Math.floor(e/1000);if(sec!==lastSecond){lastSecond=sec;if(sec>0){bomb.classList.add('running');bomb.classList.remove('drop');vib(45);bomb.classList.remove('pop');void bomb.offsetWidth;bomb.classList.add('pop');setTimeout(()=>bomb.classList.remove('pop'),180)}}bomb.style.setProperty('--zoom',(1+Math.min(e/MAX,1)*.58).toFixed(3));const slot=Math.min(Math.floor(e/SLOT),MAX/SLOT);for(let i=lastSlot+1;i<=slot;i++){if(rnd()<p){boom(i*SLOT);return}}lastSlot=slot;if(e>=nextFake&&e<MAX-1500){fakeFlash();nextFake=e+7000+rnd()*13000}if(e>=MAX){dud();return}raf=requestAnimationFrame(tick)}
function boom(ms){ended=true;cancelAnimationFrame(raf);setTimer(fmt(ms));vib([90,35,190]);bomb.style.opacity='0';ground.classList.remove('on');explosion.classList.add('go');setTimeout(()=>{scorch.classList.add('on');smoke.classList.add('on');restart.classList.add('on')},430)}function dud(){ended=true;cancelAnimationFrame(raf);setTimer('01:30:00');vib([40,70,40]);bomb.style.filter='grayscale(.35) drop-shadow(0 10px 5px rgba(0,0,0,.15))';result.textContent='DUD!';result.classList.add('on');restart.classList.add('on')}function begin(){if(starting)return;starting=true;start.classList.add('pressed');vib(20);setTimeout(()=>{wrap.classList.add('hidden');timer.classList.add('on');ground.classList.add('on');bomb.classList.add('drop');t0=performance.now();lastSlot=0;lastSecond=-1;ended=false;nextFake=8000+rnd()*10000;raf=requestAnimationFrame(tick)},120)}
