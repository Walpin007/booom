<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Random Bomb</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:manipulation;font-family:Arial,sans-serif}.game{height:100dvh;position:relative;overflow:hidden;background:#fff}.startWrap{position:absolute;inset:0;display:grid;place-items:center;z-index:20}.hidden{display:none}.start{width:154px;height:154px;border:0;border-radius:50%;background:radial-gradient(circle at 45% 32%,#ff3a30 0 10%,#e71912 40%,#c70e08 72%,#a20804 100%);box-shadow:0 10px 0 #8d0b07,0 15px 0 #b9b9b9,0 20px 15px #0002;color:#fff;font-weight:1000;font-size:24px;letter-spacing:1px;text-shadow:0 2px #8c0a06;transform:translateY(-7px)}.start.pressed{transform:translateY(4px);box-shadow:0 2px #8d0b07,0 6px #b9b9b9,0 9px 8px #0002}
.timer{position:absolute;top:15%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(2px,.7vw,5px);opacity:0;z-index:8;filter:drop-shadow(0 0 6px #f002)}.timer.on{opacity:1}.digit{position:relative;width:clamp(29px,8.2vw,48px);height:clamp(52px,14.5vw,84px)}.seg{position:absolute;background:#4a0808;opacity:.09}.seg.on{background:#f20b0b;opacity:1;box-shadow:0 0 4px #ff2626,0 0 9px #f006}.seg.a,.seg.d,.seg.g{left:10%;width:80%;height:16%;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.seg.a{top:0}.seg.g{top:42%}.seg.d{bottom:0}.seg.b,.seg.c,.seg.e,.seg.f{width:21%;height:42%;clip-path:polygon(50% 0,100% 9%,100% 91%,50% 100%,0 91%,0 9%)}.seg.b{right:0;top:6%}.seg.c{right:0;bottom:6%}.seg.e{left:0;bottom:6%}.seg.f{left:0;top:6%}.colon{position:relative;width:clamp(8px,2.3vw,13px);height:clamp(52px,14.5vw,84px)}.colon:before,.colon:after{content:"";position:absolute;left:50%;width:clamp(8px,2.2vw,12px);aspect-ratio:1;transform:translateX(-50%);background:#f20b0b;border-radius:50%;box-shadow:0 0 6px #f009}.colon:before{top:27%}.colon:after{bottom:27%}
.stage{position:absolute;left:50%;top:62%;width:min(88vw,420px);height:min(88vw,420px);transform:translate(-50%,-50%);overflow:visible}.asset{position:absolute;left:50%;image-rendering:pixelated;pointer-events:none}.shadow{width:160px;top:68%;transform:translate(-50%,-50%);opacity:0}.shadow.on{opacity:1}.bomb{width:100px;top:68%;transform:translate(-50%,-100%) scale(var(--zoom,1));transform-origin:50% 100%;opacity:0;z-index:3}.bomb.drop{animation:drop .78s cubic-bezier(.2,.8,.25,1.08) forwards}.bomb.running{opacity:1}.bomb.pop{animation:pop .18s ease-out}.explosion{width:180px;top:68%;transform:translate(-50%,-70%);opacity:0;z-index:7}.scorch{width:150px;top:68%;transform:translate(-50%,-50%);opacity:0;z-index:2}.smoke{width:80px;top:68%;transform:translate(-50%,-100%);opacity:0;z-index:5}.scorch.on,.smoke.on{opacity:1}.result{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:42px;font-weight:1000;opacity:0}.result.on{opacity:1}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none}.flash.go{animation:flash .28s linear}.restart{position:absolute;left:50%;bottom:max(7%,env(safe-area-inset-bottom));transform:translateX(-50%);border:2px solid #222;background:#fff;padding:11px 20px;font-weight:900;opacity:0;pointer-events:none}.restart.on{opacity:1;pointer-events:auto}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-520%) scale(.82) rotate(-5deg)}65%{transform:translate(-50%,-92%) scale(1.05) rotate(3deg)}80%{transform:translate(-50%,-125%) scale(.97) rotate(-2deg)}91%{transform:translate(-50%,-96%) scale(1.01)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}@keyframes pop{0%,100%{transform:translate(-50%,-100%) scale(var(--zoom))}45%{transform:translate(-50%,-110%) scale(calc(var(--zoom)*1.12))}}@keyframes flash{0%{opacity:0}18%,42%{opacity:1}100%{opacity:0}}
</style></head><body><main class="game"><div class="startWrap" id="startWrap"><button class="start" id="start">START</button></div><div class="timer" id="timer"></div><div class="result" id="result"></div><div class="stage"><img class="asset shadow" id="shadow" src="assets/shadow.png"><img class="asset bomb" id="bomb" src="assets/bomb_clean.png"><img class="asset explosion" id="explosion" src="assets/explosion_01.png"><img class="asset scorch" id="scorch" src="assets/scorch_clean.png"><img class="asset smoke" id="smoke" src="assets/smoke_01.png"></div><div class="flash" id="flash"></div><button class="restart" id="restart">RESTART</button></main><script>
(()=>{const MAX=90000,SLOT=10,SURVIVE=.01,p=1-Math.pow(SURVIVE,1/(MAX/SLOT));const $=s=>document.querySelector(s),start=$('#start'),wrap=$('#startWrap'),timer=$('#timer'),bomb=$('#bomb'),shadow=$('#shadow'),explosion=$('#explosion'),scorch=$('#scorch'),smoke=$('#smoke'),flash=$('#flash'),result=$('#result'),restart=$('#restart');let t0=0,lastSlot=0,ended=false,raf=0,lastSecond=-1,nextFake=0,starting=false,smokeTimer=0;const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296};const fmt=ms=>{ms=Math.min(ms,MAX);const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`};
const segMap={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'},digs=[];function digit(){const d=document.createElement('span');d.className='digit';for(const k of 'abcdefg'){const i=document.createElement('i');i.className='seg '+k;d.appendChild(i)}return d}for(let i=0;i<8;i++){if(i===2||i===5){const c=document.createElement('span');c.className='colon';timer.appendChild(c)}else{const d=digit();timer.appendChild(d);digs.push(d)}}function setTimer(t){const n=t.replaceAll(':','');digs.forEach((d,i)=>{const on=segMap[n[i]]||'';for(const s of d.children)s.classList.toggle('on',on.includes(s.classList[1]))})}setTimer('00:00:00');const vib=x=>{try{navigator.vibrate?.(x)}catch{}};
function frameAnim(el,prefix,count,ms,loop=false){let i=1;el.src=`assets/${prefix}_${String(i).padStart(2,'0')}.png`;el.style.opacity=1;const id=setInterval(()=>{i++;if(i>count){if(loop)i=1;else{clearInterval(id);return}}el.src=`assets/${prefix}_${String(i).padStart(2,'0')}.png`},ms);return id}function fakeFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');vib(25)}function tick(now){if(ended)return;const e=now-t0;setTimer(fmt(e));const sec=Math.floor(e/1000);if(sec!==lastSecond){lastSecond=sec;if(sec>0){vib(45);bomb.classList.remove('pop');void bomb.offsetWidth;bomb.classList.add('pop')}}bomb.style.setProperty('--zoom',(1+Math.min(e/MAX,1)*.58).toFixed(3));const slot=Math.min(Math.floor(e/SLOT),MAX/SLOT);for(let i=lastSlot+1;i<=slot;i++){if(rnd()<p){boom(i*SLOT);return}}lastSlot=slot;if(e>=nextFake&&e<MAX-1500){fakeFlash();nextFake=e+7000+rnd()*13000}if(e>=MAX){dud();return}raf=requestAnimationFrame(tick)}
function boom(ms){ended=true;cancelAnimationFrame(raf);setTimer(fmt(ms));vib([90,35,190]);bomb.style.opacity=0;shadow.style.opacity=0;frameAnim(explosion,'explosion',8,80,false);setTimeout(()=>{explosion.style.opacity=0;scorch.classList.add('on');smoke.classList.add('on');smokeTimer=frameAnim(smoke,'smoke',8,150,true);restart.classList.add('on')},650)}function dud(){ended=true;cancelAnimationFrame(raf);setTimer('01:30:00');vib([40,70,40]);bomb.style.filter='grayscale(.45)';result.textContent='DUD!';result.classList.add('on');restart.classList.add('on')}function begin(){if(starting)return;starting=true;start.classList.add('pressed');vib(20);setTimeout(()=>{wrap.classList.add('hidden');timer.classList.add('on');shadow.classList.add('on');bomb.classList.add('drop');setTimeout(()=>{bomb.classList.remove('drop');bomb.classList.add('running')},800);t0=performance.now();lastSlot=0;lastSecond=-1;ended=false;nextFake=8000+rnd()*10000;raf=requestAnimationFrame(tick)},120)}start.addEventListener('pointerdown',e=>{e.preventDefault();start.classList.add('pressed')});start.addEventListener('pointerup',e=>{e.preventDefault();begin()});start.addEventListener('click',begin);restart.addEventListener('click',()=>location.reload());})();
</script></body></html>
