<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Random Bomb</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:manipulation;font-family:Arial,sans-serif}.game{height:100dvh;min-height:100vh;position:relative;overflow:hidden;background:#fff}.hidden{display:none!important}.startWrap{position:absolute;inset:0;display:grid;place-items:center;z-index:20}.startBtn{width:min(54vw,230px);height:min(54vw,230px);border:0;padding:0;background:transparent;touch-action:none}.startBtn img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.timer{position:absolute;top:15%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(2px,.7vw,5px);opacity:0;z-index:8;filter:drop-shadow(0 0 7px #f003)}.timer.on{opacity:1}.digit{position:relative;width:clamp(29px,8.2vw,48px);height:clamp(52px,14.5vw,84px)}.seg{position:absolute;background:#4a0808;opacity:.08}.seg.on{background:#f20b0b;opacity:1;box-shadow:0 0 4px #ff2626,0 0 9px #f006}.seg.a,.seg.d,.seg.g{left:8%;width:84%;height:18%;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.seg.a{top:0}.seg.g{top:41%}.seg.d{bottom:0}.seg.b,.seg.c,.seg.e,.seg.f{width:23%;height:43%;clip-path:polygon(50% 0,100% 9%,100% 91%,50% 100%,0 91%,0 9%)}.seg.b{right:0;top:5%}.seg.c{right:0;bottom:5%}.seg.e{left:0;bottom:5%}.seg.f{left:0;top:5%}.colon{position:relative;width:clamp(8px,2.3vw,13px);height:clamp(52px,14.5vw,84px)}.colon:before,.colon:after{content:"";position:absolute;left:50%;width:clamp(8px,2.2vw,12px);aspect-ratio:1;transform:translateX(-50%);background:#f20b0b;border-radius:50%;box-shadow:0 0 6px #f009}.colon:before{top:27%}.colon:after{bottom:27%}
.stage{position:absolute;left:50%;top:63%;width:min(96vw,520px);height:min(96vw,520px);transform:translate(-50%,-50%);overflow:visible}.sprite{position:absolute;left:50%;top:64%;width:min(61vw,256px);height:min(61vw,256px);transform:translate(-50%,-87.5%);transform-origin:50% 87.5%;object-fit:contain;image-rendering:pixelated;pointer-events:none}.bomb,.flame{opacity:0}.bomb{z-index:3}.flame{z-index:4}.dust{z-index:2;opacity:0}.explosion{z-index:7;opacity:0}.aftermath{z-index:5;opacity:0}.bomb.drop,.flame.drop{animation:drop .82s cubic-bezier(.2,.8,.25,1.08) forwards}.bomb.running,.flame.running{opacity:1}.bomb.pop,.flame.pop{animation:pop .18s ease-out}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none}.flash.go{animation:flash .28s linear}.result{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:42px;font-weight:1000;opacity:0}.result.on{opacity:1}.restart{position:absolute;left:50%;bottom:max(7%,env(safe-area-inset-bottom));transform:translateX(-50%);border:2px solid #222;background:#fff;padding:11px 20px;font-weight:900;opacity:0;pointer-events:none;z-index:20}.restart.on{opacity:1;pointer-events:auto}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-300%) scale(.82) rotate(-5deg)}63%{transform:translate(-50%,-83%) scale(1.04) rotate(3deg)}78%{transform:translate(-50%,-111%) scale(.98) rotate(-2deg)}90%{transform:translate(-50%,-84%) scale(1.01)}100%{opacity:1;transform:translate(-50%,-87.5%) scale(1)}}@keyframes pop{0%,100%{transform:translate(-50%,-87.5%) scale(var(--zoom,1))}45%{transform:translate(-50%,-94%) scale(calc(var(--zoom,1)*1.10))}}@keyframes flash{0%{opacity:0}18%,42%{opacity:1}100%{opacity:0}}
</style></head><body><main class="game"><div class="startWrap" id="startWrap"><button class="startBtn" id="start" aria-label="START"><img id="startImg" src="assets/start_button/frames/start_button_01.png" alt="START"></button></div><div class="timer" id="timer"></div><div class="result" id="result"></div><div class="stage"><img class="sprite dust" id="dust"><img class="sprite bomb" id="bomb" src="assets/bomb_body/frames/bomb_body_01.png"><img class="sprite flame" id="flame"><img class="sprite explosion" id="explosion"><img class="sprite aftermath" id="aftermath"></div><div class="flash" id="flash"></div><button class="restart" id="restart">RESTART</button></main><script>
(()=>{'use strict';
const MAX=90000,SLOT=10,SURVIVE=.01,P=1-Math.pow(SURVIVE,1/(MAX/SLOT));
const A={button:{path:'assets/start_button/frames/start_button_',count:4,d:[180,80,120,180]},dust:{path:'assets/landing_dust/frames/landing_dust_',count:9,d:[50,50,65,70,70,80,90,90,40]},flame:{path:'assets/fuse_flame/frames/fuse_flame_',count:8,d:[80,70,80,70,80,70,80,70]},explosion:{path:'assets/explosion/frames/explosion_',count:13,d:[40,45,55,65,75,85,90,95,100,110,110,110,40]},aftermath:{path:'assets/aftermath/frames/aftermath_',count:8,d:[140,140,140,140,140,140,140,140]}};
const $=s=>document.querySelector(s),start=$('#start'),startImg=$('#startImg'),wrap=$('#startWrap'),timer=$('#timer'),bomb=$('#bomb'),flame=$('#flame'),dust=$('#dust'),explosion=$('#explosion'),aftermath=$('#aftermath'),flash=$('#flash'),result=$('#result'),restart=$('#restart');
let t0=0,lastSlot=0,ended=false,raf=0,lastSecond=-1,nextFake=0,starting=false,animTokens=new Map();
const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296},pad=n=>String(n).padStart(2,'0'),file=(def,i)=>def.path+pad(i)+'.png';
function preload(){Object.values(A).forEach(def=>{for(let i=1;i<=def.count;i++){const im=new Image();im.src=file(def,i)}})}preload();
const fmt=ms=>{ms=Math.min(ms,MAX);return `${pad(Math.floor(ms/60000))}:${pad(Math.floor(ms/1000)%60)}:${pad(Math.floor(ms/10)%100)}`};
const segMap={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'},digs=[];function digit(){const d=document.createElement('span');d.className='digit';for(const k of 'abcdefg'){const i=document.createElement('i');i.className='seg '+k;d.appendChild(i)}return d}for(let i=0;i<8;i++){if(i===2||i===5){const c=document.createElement('span');c.className='colon';timer.appendChild(c)}else{const d=digit();timer.appendChild(d);digs.push(d)}}function setTimer(t){const n=t.replaceAll(':','');digs.forEach((d,i)=>{const on=segMap[n[i]]||'';for(const s of d.children)s.classList.toggle('on',on.includes(s.classList[1]))})}setTimer('00:00:00');
function stopAnim(el){const token=animTokens.get(el);if(token)token.cancelled=true;animTokens.delete(el)}
function animate(el,def,{loop=false,hideAtEnd=false,onEnd=null}={}){stopAnim(el);const token={cancelled:false};animTokens.set(el,token);let i=1;el.src=file(def,i);el.style.opacity='1';function next(){if(token.cancelled)return;const delay=def.d[i-1];setTimeout(()=>{if(token.cancelled)return;i++;if(i>def.count){if(loop)i=1;else{animTokens.delete(el);if(hideAtEnd)el.style.opacity='0';onEnd?.();return}}el.src=file(def,i);next()},delay)}next();return token}
const vib=x=>{try{navigator.vibrate?.(x)}catch{}};function fakeFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');vib(25)}
function pop(){for(const el of [bomb,flame]){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}
function tick(now){if(ended)return;const e=now-t0;setTimer(fmt(e));const sec=Math.floor(e/1000);if(sec!==lastSecond){lastSecond=sec;if(sec>0){vib(45);pop()}}const zoom=1+Math.min(e/MAX,1)*.58;for(const el of [bomb,flame])el.style.setProperty('--zoom',zoom.toFixed(3));const slot=Math.min(Math.floor(e/SLOT),MAX/SLOT);for(let i=lastSlot+1;i<=slot;i++){if(rnd()<P){boom(i*SLOT);return}}lastSlot=slot;if(e>=nextFake&&e<MAX-1500){fakeFlash();nextFake=e+7000+rnd()*13000}if(e>=MAX){dud();return}raf=requestAnimationFrame(tick)}
function boom(ms){ended=true;cancelAnimationFrame(raf);setTimer(fmt(ms));vib([90,35,190]);stopAnim(flame);bomb.style.opacity='0';flame.style.opacity='0';animate(explosion,A.explosion,{hideAtEnd:true,onEnd:()=>{animate(aftermath,A.aftermath,{loop:true});restart.classList.add('on')}})}
function dud(){ended=true;cancelAnimationFrame(raf);setTimer('01:30:00');vib([40,70,40]);stopAnim(flame);flame.style.opacity='0';bomb.style.filter='grayscale(.45)';result.textContent='DUD!';result.classList.add('on');restart.classList.add('on')}
function launch(){wrap.classList.add('hidden');timer.classList.add('on');bomb.classList.add('drop');flame.classList.add('drop');animate(flame,A.flame,{loop:true});setTimeout(()=>{animate(dust,A.dust,{hideAtEnd:true});},500);setTimeout(()=>{bomb.classList.remove('drop');flame.classList.remove('drop');bomb.classList.add('running');flame.classList.add('running')},840);t0=performance.now();lastSlot=0;lastSecond=-1;ended=false;nextFake=8000+rnd()*10000;raf=requestAnimationFrame(tick)}
function begin(){if(starting)return;starting=true;vib(20);startImg.src=file(A.button,3);setTimeout(()=>{startImg.src=file(A.button,4);setTimeout(launch,130)},120)}
start.addEventListener('pointerdown',e=>{e.preventDefault();startImg.src=file(A.button,2)});start.addEventListener('pointercancel',()=>{if(!starting)startImg.src=file(A.button,1)});start.addEventListener('pointerup',e=>{e.preventDefault();begin()});start.addEventListener('click',e=>{e.preventDefault();begin()});restart.addEventListener('click',()=>location.reload());
})();</script></body></html>
