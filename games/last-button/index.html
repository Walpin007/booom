<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="color-scheme" content="only light"><title>LAST BUTTON | 모두모여 탭파티!</title>
<style>
:root{color-scheme:only light;--ink:#0d1024;--gold:#ffd16a;--safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:system-ui,-apple-system,sans-serif;background:#080b20;color:white;-webkit-text-fill-color:initial;touch-action:manipulation}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}
#app{height:100vh;height:100dvh;width:100%;max-width:560px;margin:auto;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 0%,#472a66 0%,#171533 44%,#090d22 100%);display:flex;flex-direction:column;padding:calc(var(--safeTop) + 5px) 10px calc(var(--safeBottom) + 7px);gap:clamp(5px,1.05dvh,10px)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#ffdb77 1px,transparent 1px),radial-gradient(#ff80cb 1px,transparent 1px);background-size:41px 57px,69px 89px;background-position:5px 8px,22px 34px;z-index:-1}
header{position:relative;flex:0 0 auto;min-height:clamp(64px,11dvh,102px);display:flex;align-items:center;justify-content:center;border:3px solid #ffc66a;border-radius:15px;background:linear-gradient(180deg,#7c305c 0%,#42224c 35%,#17142f 100%);box-shadow:inset 0 0 0 3px #a64366,0 4px 0 #080a17,0 0 16px #d95a9b55;padding:5px 50px}
#home{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:3px solid #ffcc75;border-radius:10px;background:linear-gradient(#ef6878,#b82c5d);box-shadow:0 4px 0 #531936;color:#fff;font-size:25px;font-weight:900;display:grid;place-items:center}
#home:active{transform:translateY(calc(-50% + 3px));box-shadow:0 1px 0 #531936}.heading{text-align:center;line-height:1.03;filter:drop-shadow(2px 3px 0 #641c46)}.heading strong{display:block;font-size:clamp(21px,6.5vw,34px);letter-spacing:1px;color:#ffdf70;-webkit-text-stroke:.5px #8a3c33}.heading strong+strong{color:#79d8ff}.heading small{display:block;margin-top:4px;color:#fff1d0;font-size:clamp(9px,2.5vw,12px);letter-spacing:1.5px;font-weight:800}
#board{flex:1 1 auto;min-height:0;position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:clamp(4px,.8dvh,9px) 9px;padding:9px 8px;border:4px solid #a64c77;border-radius:16px;background:linear-gradient(90deg,#17152d,#24213e 50%,#17152d);box-shadow:inset 0 0 0 3px #38254b,0 5px 0 #080b1b}
.pad{position:relative;min-height:0;min-width:0;overflow:hidden;border:2px solid #0d0e24;border-bottom-width:4px;border-radius:clamp(7px,1.3dvh,13px);color:#fff;background:var(--pad);box-shadow:inset 0 3px 0 #ffffff72,inset 0 -5px 0 #00000024,0 2px 0 #080b1d;transition:filter .15s,transform .12s;display:grid;place-items:center;isolation:isolate}
.pad:before{content:"";position:absolute;inset:4px 7px auto;height:20%;border-radius:100%;background:#ffffff55;pointer-events:none}.pad:after{content:"";position:absolute;inset:4px;border:1px solid #ffffff66;border-radius:5px;pointer-events:none}.pad:active:not(:disabled){transform:translateY(3px);filter:brightness(1.15)}.pad:disabled{cursor:default}.pad.safe{background:linear-gradient(180deg,#44445d,#282b42);border-bottom-width:2px;transform:translateY(2px);box-shadow:inset 0 3px 8px #0008}.pad.safe:before{display:none}.pad.safe:after{border-color:#85839b55}.pad.loser{background:linear-gradient(#ffb24c,#e24460 50%,#7c214c);box-shadow:0 0 20px #ff9c45,inset 0 3px 0 #fff8}.pad.burst{animation:burstPad .32s steps(4,end) forwards}.pad.vanish{opacity:0;pointer-events:none}.mark{font-family:ui-monospace,Menlo,monospace;font-weight:1000;font-size:clamp(25px,5.8dvh,49px);line-height:1;color:#f6f1ff;text-shadow:3px 3px 0 #161328;transform:scale(1.1)}.pad.loser .mark{font-size:clamp(27px,6dvh,51px)}
#footer{flex:0 0 auto;min-height:clamp(39px,6.2dvh,58px);display:flex;align-items:center;justify-content:space-between;gap:10px;border:3px solid #ed9a67;border-radius:12px;background:linear-gradient(#45315b,#211d3d);box-shadow:0 3px 0 #080b1b;padding:4px 11px}#status{font-weight:900;color:#ffdf84;font-size:clamp(12px,3.2vw,16px)}#remaining{color:#bfeeff;font-size:clamp(11px,3vw,15px);font-weight:900;white-space:nowrap}#restart{display:none;background:#f6a83d;border:2px solid #fff0a6;border-radius:8px;color:#27152e;padding:6px 9px;font-weight:900;font-size:12px}#restart.show{display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#090c1ccc;padding:20px}#overlay[hidden]{display:none} .dialog{width:min(100%,340px);padding:24px 18px;text-align:center;border:4px solid #ffd57c;border-radius:17px;background:linear-gradient(#543052,#22203d);box-shadow:0 8px 0 #0a0919,0 0 32px #fa7ea544}.dialog h2{margin:0 0 12px;font-size:clamp(24px,7vw,38px);color:#ffda75;text-shadow:3px 3px 0 #a53c5d}.dialog p{line-height:1.5;margin:0 0 19px;font-size:14px;color:#f7eaf8}.actions{display:flex;gap:10px;justify-content:center}.action{min-height:46px;flex:1;border:3px solid #ffe6a2;border-radius:10px;background:#e65b78;color:#fff;font-weight:900;box-shadow:0 4px 0 #5b254d}.action.primary{background:#f6b545;color:#321e31}.action:active{transform:translateY(3px);box-shadow:0 1px 0 #5b254d}
@keyframes burstPad{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.07);filter:brightness(2)}100%{transform:scale(.78);filter:brightness(2);opacity:0}}@media (max-height:620px){header{min-height:55px}.heading strong{font-size:19px}.heading small{display:none}#board{padding:5px;gap:3px 7px}#footer{min-height:36px}}@media (prefers-reduced-motion:reduce){.pad{transition:none}.pad.burst{animation:none}}
</style></head><body><main id="app"><header><button id="home" type="button" aria-label="메인 화면으로 돌아가기">←</button><div class="heading"><strong>LAST</strong><strong>BUTTON</strong><small>PIXEL BURST</small></div></header><section id="board" aria-label="20개 복불복 버튼"></section><footer id="footer"><span id="status" role="status">PICK ONE!</span><span id="remaining">20 LEFT</span><button id="restart" type="button">RETRY ↻</button></footer><canvas id="fx" aria-hidden="true"></canvas><div id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="actions" id="dialogActions"></div></div></div></main>
<script>
(()=>{'use strict';
const TOTAL=20, board=document.querySelector('#board'), app=document.querySelector('#app'), fx=document.querySelector('#fx'),ctx=fx.getContext('2d'),overlay=document.querySelector('#overlay'),title=document.querySelector('#dialogTitle'),desc=document.querySelector('#dialogText'),actions=document.querySelector('#dialogActions'),status=document.querySelector('#status'),remaining=document.querySelector('#remaining'),retry=document.querySelector('#restart');
const palette=['#f14d67','#f68b44','#f4c44d','#8bd454','#40c8a6','#4aa8ed','#7777df','#bd69dc','#f06cad','#e95982'];let chosen=-1,pressed=new Set(),ended=false,locked=false,buttons=[],particles=[],frame=0,audio=null,gameToken=0;
function randomIndex(){const a=new Uint32Array(1);if(globalThis.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*TOTAL)}return Math.floor(Math.random()*TOTAL)}
function beep(f=440,d=.06,type='square',vol=.055){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function fit(){const r=app.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);fx.width=Math.round(r.width*dpr);fx.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',fit);fit();
function scatter(el,amount=26,power=3.4){const a=el.getBoundingClientRect(),root=app.getBoundingClientRect(),x=a.left-root.left+a.width/2,y=a.top-root.top+a.height/2,c=palette[Math.floor(Number(el.dataset.index||0)/2)];for(let i=0;i<amount;i++){let ang=Math.random()*Math.PI*2,s=(Math.random()*.7+.35)*power;particles.push({x,y,vx:Math.cos(ang)*s*3,vy:Math.sin(ang)*s*3-1.3,life:30+Math.random()*20,size:2+Math.random()*5,color:i%4===0?'#fff7c6':c})}if(!frame)frame=requestAnimationFrame(draw)}
function draw(){ctx.clearRect(0,0,fx.clientWidth,fx.clientHeight);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.17;p.vx*=.985;p.life--;ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.ceil(p.size),Math.ceil(p.size))}particles=particles.filter(p=>p.life>0);frame=particles.length?requestAnimationFrame(draw):0}
function showDialog(head,message,defs){title.textContent=head;desc.textContent=message;actions.replaceChildren();defs.forEach(([label,callback,primary])=>{const b=document.createElement('button');b.type='button';b.className='action'+(primary?' primary':'');b.textContent=label;b.addEventListener('click',callback);actions.append(b)});overlay.hidden=false}function closeDialog(){overlay.hidden=true}
function start(){gameToken++;chosen=randomIndex();pressed.clear();ended=false;locked=false;particles.length=0;if(frame){cancelAnimationFrame(frame);frame=0}ctx.clearRect(0,0,fx.clientWidth,fx.clientHeight);board.replaceChildren();buttons=[];for(let i=0;i<TOTAL;i++){const b=document.createElement('button');b.className='pad';b.type='button';b.dataset.index=String(i);b.setAttribute('aria-label',`${i+1}번째 버튼`);b.style.setProperty('--pad',`linear-gradient(180deg,${palette[Math.floor(i/2)]},${palette[Math.floor(i/2)]})`);b.addEventListener('click',()=>choose(i));board.append(b);buttons.push(b)}remaining.textContent='20 LEFT';status.textContent='PICK ONE!';retry.classList.remove('show');closeDialog()}
function choose(i){if(ended||locked||pressed.has(i))return;const b=buttons[i];locked=true;if(i===chosen){ended=true;b.classList.add('loser');b.innerHTML='<span class="mark" aria-hidden="true">☠</span>';b.setAttribute('aria-label','당첨 버튼');status.textContent='YOU LOSE!';beep(180,.26,'sawtooth',.10);scatter(b,60,5);const token=gameToken;setTimeout(()=>{if(token!==gameToken)return;buttons.forEach((other,j)=>{if(j!==i&&!pressed.has(j)){other.classList.add('burst');scatter(other,14,3)}});beep(100,.4,'sawtooth',.1)},320);setTimeout(()=>{if(token!==gameToken)return;buttons.forEach((other,j)=>{if(j!==i&&!pressed.has(j))other.classList.add('vanish')});showDialog('YOU LOSE!','당첨 버튼을 눌렀습니다! 다시 도전할까요?',[['RETRY',start,true],['HOME',()=>location.href='../../index.html',false]]);retry.classList.add('show')},1050);return}
pressed.add(i);b.classList.add('safe');b.innerHTML='<span class="mark" aria-hidden="true">×</span>';b.disabled=true;b.setAttribute('aria-label',`${i+1}번째 버튼, 선택 완료`);scatter(b,24,3);beep(520,.045);setTimeout(()=>beep(720,.04),75);remaining.textContent=`${TOTAL-pressed.size} LEFT`;status.textContent='SAFE! NEXT PLAYER';const token=gameToken;setTimeout(()=>{if(token!==gameToken)return;locked=false;status.textContent='PICK ONE!'},480)}
document.querySelector('#home').addEventListener('click',()=>{if(!ended&&pressed.size>0){showDialog('EXIT GAME?','진행 중인 게임이 초기화됩니다. 메인 화면으로 돌아갈까요?',[['CANCEL',closeDialog,false],['HOME',()=>location.href='../../index.html',true]])}else location.href='../../index.html'});retry.addEventListener('click',start);start();
})();
</script></body></html>
