<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOON RACE</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;font-family:monospace}#shell{position:relative;width:100%;height:100svh;overflow:hidden;background:#fff;color:#000}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:none;pointer-events:none;font-weight:900;font-size:15px;text-shadow:2px 2px white}#hud .line{display:flex;justify-content:space-between}#progress{height:12px;border:3px solid #000;margin:7px 0;background:white}#bar{height:100%;background:black;width:0}#panel{position:absolute;top:69%;left:7%;width:86%;border:4px solid #000;background:#fff;padding:12px;text-align:center;font-weight:900;transition:opacity .25s}#start,#retry{display:block;width:75%;margin:12px auto 0;padding:13px 4px;background:#000;color:#fff;border:0;font:900 22px monospace;cursor:pointer;box-shadow:4px 4px 0 #777}#panel small{font-size:11px}#count{position:absolute;top:40%;width:100%;text-align:center;font:900 72px monospace;display:none;pointer-events:none}#result{position:absolute;inset:0;background:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:900}#result h1{font-size:clamp(23px,7vw,40px)}#time{font-size:clamp(38px,12vw,64px)}.home{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:16px;color:#000;background:#fff;border:3px solid #000;padding:7px 10px;font:900 12px monospace;text-decoration:none;z-index:5}#event{position:absolute;top:20%;width:100%;text-align:center;font:900 32px monospace;pointer-events:none}#note{position:absolute;top:12%;width:100%;text-align:center;font:900 12px monospace}</style></head><body><div id="shell"><canvas id="scene" aria-label="로켓 레이스 화면"></canvas><div id="hud"><div class="line"><span id="stage">STAGE 01</span><span id="clock">00:00:00</span></div><div id="progress"><div id="bar"></div></div><div class="line"><span>EARTH</span><span id="pct">0%</span><span>MOON</span></div></div><div id="panel"><div>LAUNCH CONTROL</div><small>EARTH → MOON</small><button id="start">START</button></div><div id="count"></div><div id="event"></div><div id="note"></div><div id="result"><h1>MISSION COMPLETE!</h1><div>FLIGHT TIME</div><div id="time">00:00:00</div><div id="landing"></div><button id="retry">RETRY</button></div><a class="home" href="../index.html">⌂ HOME</a></div><script>
(()=>{'use strict';const C=document.getElementById('scene'),ctx=C.getContext('2d',{alpha:false});const W=240,H=426,off=document.createElement('canvas');off.width=W;off.height=H;const g=off.getContext('2d',{alpha:false});const el=id=>document.getElementById(id);let state='ready',progress=0,elapsed=0,zoom=0.24,stage=1,sep=null,event=null,eventCooldown=0,eventText=0,arrival=0,landing='',last=performance.now(),countStart=0,flash=0,stars=[],particles=[],shake=0;const BASE=1/22.5;let audio;function rnd(){const a=new Uint32Array(1);if(crypto?.getRandomValues){crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}function range(a,b){return a+(b-a)*rnd()}function sound(freq=440,dur=.08,type='square'){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function fmt(t){let n=Math.floor(t*100);return String(Math.floor(n/6000)).padStart(2,'0')+':'+String(Math.floor(n/100)%60).padStart(2,'0')+':'+String(n%100).padStart(2,'0')}function reset(){state='ready';progress=0;elapsed=0;zoom=.24;stage=1;sep=null;event=null;eventCooldown=0;eventText=0;arrival=0;flash=0;particles=[];el('hud').style.display='none';el('panel').style.display='block';el('result').style.display='none';el('count').style.display='none';el('event').textContent='';el('note').textContent='';}function start(){if(state!=='ready')return;sound(360);state='countdown';countStart=performance.now();el('panel').style.display='none';el('count').style.display='block';}el('start').onclick=start;el('retry').onclick=reset;function begin(){state='flight';el('count').style.display='none';el('hud').style.display='block';sound(620,.25);}
function eventStart(){const r=rnd();let kind=r<.25?'BOOST':r<.5?'HIT':r<.7?'ERROR':r<.9?'UFO':'WARP';let duration=kind==='ERROR'?1:kind==='WARP'?.42:2;let mult=kind==='BOOST'?2:kind==='HIT'?.5:kind==='ERROR'?0:1; if(kind==='UFO')mult=rnd()<.5?1.75:.6;if(kind==='WARP'){let old=progress;progress=Math.min(.985,progress+(1-progress)*range(.10,.20));flash=.18;checkSep(old,progress)}event={kind,duration,left:duration,mult};eventText=1.2;el('event').textContent=kind+'!';shake=kind==='HIT'?.25:kind==='BOOST'?.15:0;sound(kind==='ERROR'?180:kind==='BOOST'?800:kind==='WARP'?960:340,.17)}function checkSep(before,after){if(!sep&&stage===1&&after>=.25){sep={from:1,left:1.2,at:1.2};stage=2;sound(260,.16)}else if(!sep&&stage===2&&after>=.55){sep={from:2,left:1.2,at:1.2};stage=3;sound(340,.16)}}function land(){state='landing';arrival=0;let r=rnd();landing=r<.4?'PERFECT LANDING':r<.65?'PHEW!':r<.85?'HELLO MOON!':r<.95?'WELCOME!':'MOON PARTY!';sound(780,.28);el('event').textContent='';}function update(dt,now){if(state==='countdown'){let passed=(now-countStart)/1000;let value=passed<3?String(3-Math.floor(passed)):'GO!';if(el('count').textContent!==value){el('count').textContent=value;sound(passed<3?440:760,.07)}zoom=.24+.03*Math.min(1,passed/3);if(passed>=3.42)begin();return}if(state==='flight'){elapsed+=dt;let prev=progress;let base=stage===1?1:stage===2?1.4:1.8;let m=event?event.mult:1;progress=Math.min(1,progress+dt*BASE*base*m);checkSep(prev,progress);if(sep){sep.left-=dt;if(sep.left<=0){sep=null;sound(660,.09)}}if(event){event.left-=dt;if(event.left<=0){event=null;eventCooldown=.3}}else if(sep===null&&progress<.9){eventCooldown-=dt;if(eventCooldown<=0&&rnd()<1-Math.exp(-.22*dt))eventStart()}if(eventText>0){eventText-=dt;if(eventText<=0)el('event').textContent=''}if(shake>0)shake-=dt;if(flash>0)flash-=dt;let target=progress<.125?.24+(.76*progress/.125):1;if(sep){let p=1-sep.left/sep.at;let ratio=sep.from===1?.55:.20/.55;target=(1-p)*ratio+p}if(progress>=.85)target=Math.max(.45,1-(progress-.85)/.15*.55);zoom+= (target-zoom)*Math.min(1,dt*4.5);el('clock').textContent=fmt(elapsed);el('pct').textContent=Math.floor(progress*100)+'%';el('bar').style.width=progress*100+'%';el('stage').textContent='STAGE 0'+stage;if(progress>=1){progress=1;land()}}else if(state==='landing'){arrival+=dt;if(arrival>=2.1){state='result';el('result').style.display='flex';el('time').textContent=fmt(elapsed);el('landing').textContent=landing;el('hud').style.display='none'}}}
function rect(x,y,w,h,c='#000'){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function rocketShape(x,y,s,part){const a=Math.max(1,Math.round(s));const b=(xx,yy,ww,hh,col)=>rect(x+xx*s,y+yy*s,ww*s,hh*s,col);if(part===3){b(6,0,8,4);b(4,4,12,5);b(2,9,16,20);b(2,13,16,3,'#fff');b(7,15,6,6,'#fff');b(8,16,4,4)}if(part===2){b(2,0,16,32);b(5,3,10,24,'#fff');b(2,8,16,3);b(2,28,16,4)}if(part===1){b(0,0,20,42);b(4,4,12,30,'#fff');b(0,16,20,3);b(-4,28,4,16);b(20,28,4,16);b(3,40,14,3)}}function drawRocket(x,y,scale,parts,flame=true){let yy=y;for(let p of parts){rocketShape(x,yy,scale,p);yy+=({3:29,2:32,1:43})[p]*scale}if(flame){let len=(7+Math.sin(performance.now()/80)*3)*(event?.kind==='BOOST'?2:1);rect(x+7*scale,yy,6*scale,len*scale);rect(x+9*scale,yy+len*scale,2*scale,4*scale)}}function scene(){rect(0,0,W,H,'#fff');let p=progress;const sky=p<.35;if(state==='ready'||state==='countdown'||(state==='flight'&&p<.15)){let ground=state==='ready'?282:Math.min(510,282+p*1100);rect(0,ground,W,H-ground);for(let i=0;i<5;i++)rect(i*55,ground-4-(i%3)*3,35,5);rect(91,ground-56,4,56);for(let i=0;i<6;i++)rect(95,ground-55+i*9,16,2);rect(120,ground-10,37,10)}if(p>.13||state==='landing'){for(let i=0;i<stars.length;i++){let s=stars[i],yy=(s.y+p*700*(i%3+1))%H;rect(s.x,yy,s.sz,s.sz)}}if(p>.7){let r=18+Math.max(0,(p-.7)/.3)*110;let cx=170,cy=75+(p-.7)*180;for(let y=-r;y<=r;y+=3){let w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));rect(cx-w,cy+y,w*2,3)}for(let j=0;j<12;j++){let a=j*2.4;let xx=cx+Math.cos(a)*r*.65,yy=cy+Math.sin(a)*r*.6;rect(xx,yy,Math.max(2,r*.12),Math.max(2,r*.04),'#fff')}}if(state==='landing'||state==='result'){rect(0,310,240,116);for(let i=0;i<15;i++)rect(i*23%240,320+i*19%100,8,2,'#fff');drawRocket(102,210,1.2,[3],false);return}let parts=stage===1?[3,2,1]:stage===2?[3,2]:[3];let total=parts.reduce((a,v)=>a+({3:29,2:32,1:43})[v],0);let scl=zoom*H*.5/total;let rocketX=W/2-10*scl,rocketY=H/2-total*scl/2;if(state==='ready'){scl=.44;rocketX=W/2-10*scl;rocketY=282-104*scl}else if(state==='countdown'){scl=.44+(zoom-.24)*.3;rocketX=W/2-10*scl;rocketY=282-104*scl}if(state==='flight'&&shake>0){rocketX+=Math.round(range(-2,2));rocketY+=Math.round(range(-2,2))}drawRocket(rocketX,rocketY,scl,parts,state==='flight'&&event?.kind!=='ERROR');if(sep){let gone=sep.from;let fallen=sep.at-sep.left;let gs=scl*(sep.from===1?.7:.8);drawRocket(W/2-10*gs,rocketY+total*scl+fallen*130,gs,[gone],false)}if(event?.kind==='UFO'){rect(26,95,44,5);rect(34,89,28,6);rect(40,84,16,5);rect(30,100,4,4);rect(56,100,4,4)}if(event?.kind==='HIT'){for(let i=0;i<9;i++)rect(rocketX+range(-30,40),rocketY+range(0,40),3,3)}if(event?.kind==='BOOST'){for(let i=0;i<12;i++)rect(i*27%240,(performance.now()/2+i*49)%426,2,17)}if(flash>0){g.globalCompositeOperation='difference';rect(0,0,W,H,'#fff');g.globalCompositeOperation='source-over'}}function render(){scene();let w=innerWidth,h=innerHeight,dpr=Math.min(2,devicePixelRatio||1);if(C.width!==Math.round(w*dpr)||C.height!==Math.round(h*dpr)){C.width=Math.round(w*dpr);C.height=Math.round(h*dpr)}ctx.imageSmoothingEnabled=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,C.width,C.height);let scale=Math.max(C.width/W,C.height/H),dw=W*scale,dh=H*scale;ctx.drawImage(off,(C.width-dw)/2,(C.height-dh)/2,dw,dh)}function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now);render();requestAnimationFrame(frame)}for(let i=0;i<48;i++)stars.push({x:Math.floor(rnd()*W),y:Math.floor(rnd()*H),sz:rnd()<.85?1:2});reset();requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='flight'||state==='countdown')){reset();el('note').textContent='화면 전환으로 레이스가 초기화되었습니다.'}});})();
</script></body></html>
